- fundo: branco
  titulo: História
  blocos:
  - tipo: texto
    texto: |-
      Fundada em 1996, a Cia de Rafting é uma das cinco primeiras operadoras de Rafting Comercial do Brasil, responsável pela implantação das operações na Bacia do Rio Paraibuna, na região do Vale do Paraíba, no Estado de São Paulo, que abrangem os municípios de São Luiz do Paraitinga, importante centro cultural e arquitetônico, e Natividade da Serra, situados a 180 km de São Paulo.

      Composta por colaboradores com formações técnicas, acadêmicas e ensino médio, com certificação na IRF – International Rafting Federation e nas NBR (Normas Brasileiras de Referência) ABNT, desenvolvemos nossas atividades de turismo de aventura em conformidade com a legislação aplicável e as boas práticas já consagradas em nosso meio.
- fundo: suave
  blocos:
  - tipo: missao
    itens:
    - titulo: Missão
      texto: Conectar pessoas à natureza através de nossos serviços no mais alto grau de espírito de aventura.
    - titulo: Visão
      texto: Acreditamos que as atividades de aventura praticadas ao ar livre são ferramentas que permitem estimular mudanças fantásticas nas pessoas e no seu entorno. Desta forma, é nosso dever criar os meios que possibilitem o acesso de todos a estas experiências.
    - titulo: Valores
      texto: Honestidade, legalidade, responsabilidade, planejamento e segurança.
- fundo: branco
  blocos:
