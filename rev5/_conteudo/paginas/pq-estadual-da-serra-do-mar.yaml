titulo_aba: Pq. Estadual da Serra do Mar | Cia de Rafting
descricao: 'Parque Estadual da Serra do Mar: zona de amortecimento e Núcleo Santa Virgínia, onde a Cia de Rafting concentra suas operações na Mata Atlântica.'
