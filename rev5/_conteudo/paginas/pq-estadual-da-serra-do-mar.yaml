      **Aves silvestres:** periquito, coruja, gavião-pomba, papagaio-chauá, entre outras.

      **Vegetação:** vegetação exuberante, destacando-se jequitibás, jataís, cedros, ipês, guapuruvus, palmeiras, quaresmeiras, manacás e grande variedade de bromélias e orquídeas, que emprestam à Serra do Mar beleza ímpar com suas flores. E ainda raízes e folhas medicinais, pesquisadas para a cura de doenças.
