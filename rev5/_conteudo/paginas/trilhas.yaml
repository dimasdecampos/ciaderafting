    detalhes: |-
      **Roteiro:** Ecoturismo.

      **Ambiente:** Unidade de Conservação da Mata Atlântica; observação de fauna e flora em mata secundária inicial e madura, com remanescentes de mata primária; mirante do vale do Rio Paraibuna, Cachoeira das Andorinhas, Cachoeira do Salto Grande e mirante da Cachoeira do Saltinho.

      **Incluso:** seguro viagem e guia.

      **Ponto de encontro:** Núcleo Santa Virgínia, com acesso pelo km 78 da Rodovia Oswaldo Cruz, seguindo por mais 3 km de estrada de terra até o estacionamento da base do Parque Estadual da Serra do Mar.
