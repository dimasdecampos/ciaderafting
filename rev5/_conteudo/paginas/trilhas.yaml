secoes:
- fundo: branco
  blocos:
  - tipo: destaque
    texto: A palavra trekking significa jornada, "uma jornada a pé". A caminhada ou trekking em trilhas é a mais básica das atividades humanas que se pode realizar num ambiente ao ar livre. Com o crescente interesse das pessoas por esta atividade, o grau de aperfeiçoamento exigido numa trilha passa pelo ser humano que a conduz, pela segurança, pelos equipamentos e pelo estudo de capacidade de carga do ambiente visitado.
  - tipo: texto
    texto: |-
      Dentro destes conceitos, a Cia de Rafting preparou roteiros de trilhas que podem ser realizados por pessoas dos oito aos oitenta anos, por famílias e por grupos mais avançados na arte de caminhar, todos dentro do Parque Estadual da Serra do Mar – Núcleo Santa Virgínia.

      O trekking também é utilizado como ferramenta para o fomento e o desenvolvimento da Educação Ambiental, através dos processos de Trilhas Interpretativas (Programa de Estudos do Meio).
