    - tipo: texto
      texto: Fundada em 1996, a Cia de Rafting é uma das cinco primeiras operadoras de Rafting Comercial do Brasil, responsável pela implantação das operações na Bacia do Rio Paraibuna, na região do Vale do Paraíba, no Estado de São Paulo, que abrangem os municípios de São Luiz do Paraitinga, importante centro cultural e arquitetônico, e Natividade da Serra, situados a 180 km de São Paulo.
