titulo_aba: Expedição de Rafting 4 Horas – Brazadão | Cia de Rafting
descricao: Rafting de aproximadamente 4 horas no Rio Paraibuna, em Natividade da Serra, com parada na Praia do Funilzão. Ponto de encontro no km 59 da Rod. Oswaldo Cruz.
